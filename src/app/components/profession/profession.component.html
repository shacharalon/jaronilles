<section class="hero-banner">
  <div class="hero-icon"><i class="fa-solid fa-briefcase"></i></div>
  <div>
    <h1 class="about-name">{{ title }}</h1>
    <p class="about-role">{{ role }}</p>
    <p class="about-intro">{{ profession.intro }}</p>
  </div>
</section>

<div class="row g-3 mt-2">
  <div class="col-6 col-md" *ngFor="let item of profession.items; let i = index">
    <button type="button" class="topic-btn" [class.active]="i === selected" (click)="selected = i">
      <i class="fa-solid {{ item.icon }}"></i>
      <span>{{ item.title }}</span>
    </button>
  </div>
</div>

<div class="info-card topic-panel mt-3">
  <h5 class="card-heading mb-3"><i class="fa-solid {{ current.icon }}"></i> {{ current.title }}</h5>
  <p *ngFor="let p of current.paragraphs">{{ p }}</p>
  <img *ngIf="current.image" [src]="current.image" [alt]="current.imageAlt" class="topic-image" />
</div>
