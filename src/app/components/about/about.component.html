<section class="about-hero">
  <img [src]="about.photo" [alt]="name" class="about-photo" />
  <div class="about-hero-text">
    <h1 class="about-name">{{ name }}</h1>
    <p class="about-role">{{ about.role }}</p>
    <p class="about-intro">{{ about.intro }}</p>
  </div>
</section>

<h5 class="section-title text-center">{{ about.title }}</h5>
<div class="row g-3">
  <div class="col-sm-6 col-lg-3" *ngFor="let r of about.rows">
    <div class="info-card fact-tile h-100">
      <i class="fa-solid {{ r.icon }} feature-icon"></i>
      <div class="fact-label">{{ r.label }}</div>
      <div class="fact-value">{{ r.value }}</div>
    </div>
  </div>
</div>

<blockquote class="quote-banner">
  <span class="quote-text">&ldquo;{{ about.quote.text }}&rdquo;</span>
  <footer>&ndash; {{ about.quote.author }}</footer>
</blockquote>
