<h3 class="page-title text-center">{{ title }}</h3>
<hr class="page-divider" />

<div class="row g-4">
  <div class="col-md-4" *ngFor="let h of hobbies">
    <div class="info-card text-center h-100">
      <i class="fa-solid {{ h.icon }} feature-icon"></i>
      <h5>{{ h.title }}</h5>
      <p class="mb-0">{{ h.text }}</p>
    </div>
  </div>
</div>
