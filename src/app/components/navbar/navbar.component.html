<nav class="cookbook-navbar">
  <div class="navbar-brand">
    <i class="fa-solid fa-book-open"></i>
    <span>{{ owner }}</span>
  </div>

  <div class="navbar-links">
    <a
      *ngFor="let tab of tabs"
      [routerLink]="tab.link"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: tab.exact }"
      class="nav-link savory-link"
    >
      <i class="fa-solid {{ tab.icon }}"></i>
      {{ tab.label }}
    </a>

    <div class="lang-switch" role="group" [attr.aria-label]="language.content.ui.languageLabel">
      <button
        *ngFor="let l of languages"
        type="button"
        class="lang-btn"
        [class.active]="language.lang === l.code"
        [attr.aria-pressed]="language.lang === l.code"
        (click)="language.set(l.code)"
      >
        {{ l.label }}
      </button>
    </div>
  </div>
</nav>
