<h3 class="page-title text-center">{{ title }}</h3>
<hr class="page-divider" />

<ul class="nav nav-pills justify-content-center mb-4">
  <li class="nav-item">
    <button type="button" class="nav-link" [class.active]="view === 'recipes'" (click)="view = 'recipes'">
      <i class="fa-solid fa-bowl-food"></i> {{ history.recipesLabel }}
    </button>
  </li>
  <li class="nav-item">
    <button type="button" class="nav-link" [class.active]="view === 'technology'" (click)="view = 'technology'">
      <i class="fa-solid fa-microchip"></i> {{ history.technologyLabel }}
    </button>
  </li>
</ul>

<p class="text-center text-muted" *ngIf="entries.length === 0">{{ history.empty }}</p>

<div class="row g-3">
  <div class="col-md-6" *ngFor="let e of entries">
    <div class="info-card h-100">
      <span class="text-muted small">{{ e.month }}</span>
      <h6 class="card-heading mb-2">{{ e.name }}</h6>
      <p class="mb-0">{{ e.text }}</p>
    </div>
  </div>
</div>
