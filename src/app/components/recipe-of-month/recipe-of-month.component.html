<h3 class="page-title text-center">Recipe of the month</h3>
<hr class="page-divider" />

<div class="info-card" *ngIf="recipe">
  <p class="text-muted mb-1">{{ config.month }}</p>
  <div class="row g-4">
    <div class="col-md-5" *ngIf="recipe.image">
      <img [src]="recipe.image" [alt]="recipe.name" class="img-fluid rounded" />
    </div>
    <div [ngClass]="recipe.image ? 'col-md-7' : 'col-12'">
      <h2>{{ recipe.name }}</h2>
      <p>{{ recipe.description }}</p>
      <p class="text-muted">
        <i class="fa-regular fa-clock"></i> {{ recipe.time }} &bull;
        <i class="fa-solid fa-user-group"></i> {{ recipe.servings }} Personen
      </p>
      <p>{{ config.note }}</p>
    </div>
  </div>

  <div class="row g-4 mt-1">
    <div class="col-md-5">
      <h6>Zutaten</h6>
      <ul>
        <li *ngFor="let i of recipe.ingredients">{{ i.amount }} {{ i.unit }} {{ i.name }}</li>
      </ul>
    </div>
    <div class="col-md-7">
      <h6>Zubereitung</h6>
      <ol>
        <li *ngFor="let step of recipe.instructions">{{ step }}</li>
      </ol>
    </div>
  </div>
</div>
